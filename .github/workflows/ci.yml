name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches the `environment: sdk: ^3.12.1` constraint in pubspec.yaml.
  FLUTTER_CHANNEL: stable

jobs:
  # The cheap job, and the one that catches most things. Runs on every push.
  analyze:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      # The generated DI/freezed files are committed; regenerating here proves
      # they are not stale, which is otherwise only found at runtime.
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Fail if generated files drifted
        run: git diff --exit-code -- lib/core/di/injection.config.dart
      - run: flutter analyze
      - run: flutter test

  windows:
    name: Windows build
    runs-on: windows-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/windows/x64/runner/Release/

  linux:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      # The first line is what Flutter itself needs, and is the same list the
      # app's own `linux_deps_missing` doctor fix installs — if it changes,
      # change it there too. The second is this app's own: tray_manager's
      # CMakeLists fails configuration outright without ayatana-appindicator3.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
          sudo apt-get install -y libayatana-appindicator3-dev

      - run: flutter pub get
      - run: flutter build linux --release

      - name: Assemble the AppDir
        run: |
          set -eux
          APPDIR=build/AppDir
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          cp -r build/linux/x64/release/bundle/* "$APPDIR/usr/bin/"
          cp assets/app_icon.png \
             "$APPDIR/usr/share/icons/hicolor/256x256/apps/flutra.png"
          # AppImage looks for the icon beside AppRun as well.
          cp assets/app_icon.png "$APPDIR/flutra.png"

          cat > "$APPDIR/usr/share/applications/flutra.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Flutra
          Comment=Graphical frontend for the Android SDK command-line tools
          Exec=flutra
          Icon=flutra
          Categories=Development;
          Terminal=false
          DESKTOP
          cp "$APPDIR/usr/share/applications/flutra.desktop" \
             "$APPDIR/flutra.desktop"

          cat > "$APPDIR/AppRun" <<'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          # The bundle keeps its libraries beside the binary.
          export LD_LIBRARY_PATH="$HERE/usr/bin/lib:$LD_LIBRARY_PATH"
          exec "$HERE/usr/bin/flutra" "$@"
          APPRUN
          chmod +x "$APPDIR/AppRun"

      - name: Build the AppImage
        run: |
          set -eux
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          # The runner has no FUSE, so the tool has to be unpacked to run.
          ./appimagetool-x86_64.AppImage --appimage-extract > /dev/null
          ARCH=x86_64 ./squashfs-root/AppRun build/AppDir \
            build/Flutra-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: build/Flutra-x86_64.AppImage

  macos:
    name: macOS dmg
    # Expensive minutes, and the artifact is unsigned — not worth running on
    # every pull request.
    if: github.event_name == 'push'
    runs-on: macos-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release

      # Unsigned and un-notarised: there is no Apple Developer account, so
      # Gatekeeper will refuse a double-click. Right-click → Open, or
      # `xattr -dr com.apple.quarantine <app>`, is the documented way in.
      - name: Package the dmg
        run: |
          set -eux
          APP="build/macos/Build/Products/Release/Flutra.app"
          STAGING=build/dmg
          mkdir -p "$STAGING"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "Flutra" -srcfolder "$STAGING" \
            -ov -format UDZO build/Flutra.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: build/Flutra.dmg

  # Publishes what the three build jobs already produced. Run artifacts expire
  # and need a GitHub login to download; a release is the copy that does not.
  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [windows, linux, macos]
    permissions:
      # The default token is read-only, and creating a release is a write.
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Name the downloads after the tag
        run: |
          set -eux
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          # Windows ships as a folder of loose files; the other two are already
          # single files and only need the version in their name.
          (cd artifacts/windows-release &&
           zip -qr "$GITHUB_WORKSPACE/dist/Flutra-$VERSION-windows-x64.zip" .)
          mv artifacts/linux-appimage/Flutra-x86_64.AppImage \
             "dist/Flutra-$VERSION-x86_64.AppImage"
          mv artifacts/macos-dmg/Flutra.dmg "dist/Flutra-$VERSION-macos.dmg"
          ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # A half-populated release reads as a complete one; better to fail.
          fail_on_unmatched_files: true
          # The commits and pull requests since the previous tag, written by
          # GitHub and appended below this body.
          generate_release_notes: true
          body: |
            ## Downloads

            | Platform | File |
            | --- | --- |
            | Windows 10+ (x64) | `Flutra-*-windows-x64.zip` — unzip and run `flutra.exe` |
            | Linux (x86_64) | `Flutra-*-x86_64.AppImage` — `chmod +x`, then run |
            | macOS | `Flutra-*-macos.dmg` |

            Nothing here is code-signed. Windows SmartScreen needs
            *More info → Run anyway*, and macOS Gatekeeper needs right-click →
            *Open*, or `xattr -dr com.apple.quarantine /Applications/Flutra.app`.

            The Linux build is packaged by CI but has not been run by a
            maintainer.
