name: flutra
description: "Flutra — a desktop manager for the Android SDK and Flutter toolchain."
publish_to: 'none'
version: 1.0.4+4

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # UI (Windows-native look)
  fluent_ui: ^4.9.2
  fluentui_system_icons: ^1.1.273

  # State management
  flutter_bloc: ^9.1.0
  bloc: ^9.0.0

  # Dependency injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Models / immutability
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  equatable: ^2.0.7

  # IO / networking / files
  dio: ^5.8.0
  archive: ^4.0.2
  path: ^1.9.1
  path_provider: ^2.1.5
  process_run: ^1.2.4
  win32: ^5.10.0

  # Utils
  logging: ^1.3.0
  intl: ^0.20.2
  desktop_multi_window: ^0.3.0
  window_manager: ^0.5.1
  tray_manager: ^0.5.3
  file_selector: ^1.1.0
  simple_icons: ^16.23.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.4.14
  freezed: ^3.0.4
  json_serializable: ^6.9.4
  injectable_generator: ^2.7.0
  msix: ^3.16.8

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.ico
    # Flutter can't decode .ico, so the About window uses the png.
    - assets/app_icon.png
    - assets/logo.png 

# Windows MSIX packaging. Build with: dart run msix:create
msix_config:
  display_name: Flutra
  publisher_display_name: Tegar Nugroho
  identity_name: com.flutra
  # Must match the subject of certificate.pfx exactly, or SignTool fails with
  # SignerSign() 0x8007000b. The bundled self-signed certificate was issued to
  # CN=FlutterSdkManager, so this keeps the old name even though the product is
  # now Flutra — it is a cryptographic identity, not a label. What users see is
  # publisher_display_name above.
  #
  # To make it match the product name, generate a certificate for CN=Flutra and
  # change both lines together.
  publisher: CN=FlutterSdkManager
  msix_version: 1.0.4.4
  output_name: Flutra
  certificate_path: certificate.pfx
  certificate_password: flutter123
  capabilities: internetClient
  install_certificate: false
  logo_path: windows\runner\resources\app_icon.ico
